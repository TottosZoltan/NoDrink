<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebLife Szimulátor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Header: Név, Kor, Pénz -->
        <header>
            <div class="profile-info">
                <h1 id="player-name">Név</h1>
                <div class="badges">
                    <span id="player-age" class="badge badge-blue">Kor: 0</span>
                    <span id="player-money" class="badge badge-gold">Pénz: 0 Ft</span>
                </div>
            </div>
        </header>

        <!-- Statisztikák (0-100%) -->
        <section id="stats-section">
            <div class="stat-item">
                <div class="stat-label"><span>Boldogság</span><span id="val-happiness">100%</span></div>
                <div class="progress-bg"><div class="progress-fill happiness" id="bar-happiness"></div></div>
            </div>
            <div class="stat-item">
                <div class="stat-label"><span>Egészség</span><span id="val-health">100%</span></div>
                <div class="progress-bg"><div class="progress-fill health" id="bar-health"></div></div>
            </div>
            <div class="stat-item">
                <div class="stat-label"><span>Okosság</span><span id="val-smarts">100%</span></div>
                <div class="progress-bg"><div class="progress-fill smarts" id="bar-smarts"></div></div>
            </div>
            <div class="stat-item">
                <div class="stat-label"><span>Kinézet</span><span id="val-looks">100%</span></div>
                <div class="progress-bg"><div class="progress-fill looks" id="bar-looks"></div></div>
            </div>
        </section>

        <!-- Eseménynapló -->
        <section id="log-section">
            <div id="log-container">
                <!-- A logok ide generálódnak JS-ből -->
            </div>
        </section>

        <!-- Interakciós gombok -->
        <section id="actions-section">
            <button id="btn-age-up" class="btn-primary">➕ ÖREGEDÉS (+1 év)</button>
            <div class="action-grid">
                <button id="btn-study" class="btn-secondary">📚 Tanulás</button>
                <button id="btn-work" class="btn-secondary">💼 Diákmunka</button>
                <button id="btn-gym" class="btn-secondary">🏋️ Edzés (5k Ft)</button>
                <button id="btn-doctor" class="btn-secondary">🏥 Orvos (15k Ft)</button>
            </div>
            <button id="btn-reset" class="btn-danger">☠️ Új élet kezdése</button>
        </section>

        <!-- Modális ablak döntéshelyzetekhez (Választós Események) -->
        <div id="event-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">Esemény</h2>
                <p id="modal-desc">Leírás...</p>
                <div id="modal-buttons">
                    <!-- Gombok dinamikusan -->
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
